<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result App</title>

  <link rel="stylesheet" href="Result.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>Student Login</h2>
  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="matric" placeholder="Matric Number">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">

  <h1>📊 School Result System</h1>

  <div class="card">

    <h3 id="studentInfo"></h3>

    <div id="subjects"></div>

    <button onclick="addSubject()">➕ Add Course</button>

    <h2 id="result"></h2>
    <h3 id="prediction"></h3>

    <table id="table" style="display:none;">
      <tr>
        <th>Course Code</th>
        <th>Score</th>
        <th>Unit</th>
        <th>Grade</th>
      </tr>
    </table>

    <canvas id="chart"></canvas>

  </div>

  <div class="btn-area">
    <button onclick="calculateGPA()">Calculate GPA</button>
    <button onclick="toggleDark()">🌙 Dark Mode</button>
  </div>

</div>

<script>

let student = {};

/* LOGIN */
function login() {
  let name = document.getElementById("name").value.trim();
  let matric = document.getElementById("matric").value.trim();

  if (!name || !matric) {
    alert("Fill all fields");
    return;
  }

  student = { name, matric };

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("studentInfo").innerText =
    `Name: ${name} | Matric: ${matric}`;

  addSubject();
}

/* ADD COURSE */
function addSubject() {
  let row = document.createElement("div");
  row.className = "row";

  row.innerHTML = `
    <input type="text" placeholder="Course Code (e.g. MTH101)" class="subject">
    <input type="number" placeholder="Score" class="score">
    <input type="number" placeholder="Unit" class="unit">
  `;

  document.getElementById("subjects").appendChild(row);
}

/* GPA CALCULATION */
function calculateGPA() {

  let rows = document.querySelectorAll(".row");

  let totalPoints = 0;
  let totalUnits = 0;

  let grades = {A:0,B:0,C:0,D:0,F:0};

  let table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>Course Code</th>
      <th>Score</th>
      <th>Unit</th>
      <th>Grade</th>
    </tr>
  `;

  let valid = false;

  rows.forEach(row => {

    let course = row.querySelector(".subject").value.trim();
    let scoreVal = row.querySelector(".score").value;
    let unitVal = row.querySelector(".unit").value;

    if (!course || scoreVal === "" || unitVal === "") return;

    let score = Number(scoreVal);
    let unit = Number(unitVal);

    if (isNaN(score) || isNaN(unit)) return;

    valid = true;

    let point = getPoint(score);
    let grade = getGrade(score);

    totalPoints += point * unit;
    totalUnits += unit;

    table.innerHTML += `
      <tr>
        <td>${course}</td>
        <td>${score}</td>
        <td>${unit}</td>
        <td>${grade}</td>
      </tr>
    `;

    grades[grade]++;
  });

  if (!valid || totalUnits === 0) {
    alert("No valid courses entered");
    return;
  }

  table.style.display = "table";

  let gpa = totalPoints / totalUnits;

  document.getElementById("result").innerText =
    "GPA: " + gpa.toFixed(2);

  document.getElementById("prediction").innerText =
    predict(gpa);

  drawChart(grades);
}

/* POINT SYSTEM */
function getPoint(score){
  if(score>=70) return 5;
  if(score>=60) return 4;
  if(score>=50) return 3;
  if(score>=45) return 2;
  if(score>=40) return 1;
  return 0;
}

/* GRADE */
function getGrade(score){
  if(score>=70) return "A";
  if(score>=60) return "B";
  if(score>=50) return "C";
  if(score>=40) return "D";
  return "F";
}

/* PREDICTION */
function predict(gpa){
  if(gpa>=4.5) return "Excellent";
  if(gpa>=3.5) return "Very Good";
  if(gpa>=2.5) return "Good";
  if(gpa>=1.5) return "Average";
  return "Poor";
}

/* CHART */
function drawChart(data){

  const ctx = document.getElementById("chart").getContext("2d");

  if(window.chart) window.chart.destroy();

  window.chart = new Chart(ctx,{
    type:"bar",
    data:{
      labels:["A","B","C","D","F"],
      datasets:[{
        label:"Grades",
        data:[data.A,data.B,data.C,data.D,data.F]
      }]
    }
  });
}

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
